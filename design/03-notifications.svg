text x="32" y="393" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#568FFF">04</text><text x="64" y="393" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#EFF3FA">Уведомления</text><text x="32" y="444" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#95A2B4">05</text><text x="64" y="444" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#95A2B4">Файлы</text><text x="32" y="495" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#95A2B4">06</text><text x="64" y="495" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#95A2B4">Внешний доступ</text><path d="M24 867 L208 867" stroke="#283240"/><text x="28" y="901" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#95A2B4">Настройки</text><text x="28" y="942" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#EFF3FA">Wenwu · Администратор</text><text x="28" y="974" font-family="Inter,DejaVu Sans,sans-serif" font-size="10" font-weight="400" fill="#95A2B4">v0.1 / Design preview</text><text x="264" y="44" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Домашняя сеть  /  Уведомления</text><text x="1035" y="44" font-family="Inter,DejaVu Sans,sans-serif" font-size="11" font-weight="400" fill="#95A2B4">Демо-данные · 09.10.2026, 17:42</text><path d="M264 65 L1408 65" stroke="#283240"/><text x="264" y="116" font-family="Inter,DejaVu Sans,sans-serif" font-size="30" font-weight="600" fill="#EFF3FA">Уведомления</text><text x="264" y="147" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#95A2B4">Каналы доставки и правила эскалации для вашей сети.</text><rect x="1210" y="98" width="198" height="40" rx="6" fill="#568FFF"/><text x="1226" y="123" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Сохранить</text><rect x="264" y="186" width="562" height="321" rx="8" fill="#12161D" stroke="#283240"/><text x="288" y="220" font-family="Inter,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#EFF3FA">Каналы доставки</text><rect x="846" y="186" width="562" height="321" rx="8" fill="#12161D" stroke="#283240"/><text x="870" y="220" font-family="Inter,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#EFF3FA">Когда уведомлять</text><text x="288" y="270" font-family="Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#EFF3FA">Telegram</text><text x="288" y="294" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Подключён · чат администратора</text><text x="288" y="335" font-family="Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#EFF3FA">Email / SMTP</text><text x="288" y="359" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Подключён · alerts@example.com</text><text x="288" y="400" font-family="Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#EFF3FA">Webhook</text><text x="288" y="424" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Не настроен</text><rect x="624" y="447" width="178" height="40" rx="6" fill="#1B2431"/><text x="640" y="472" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="600" fill="#EFF3FA">Отправить тест</text><text x="870" y="272" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">✓  Потеря интернета или недоступность сервиса</text><text x="870" y="309" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">✓  Восстановление после сбоя</text><text x="870" y="346" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Порог: 3 ошибки подряд · интервал 10 секунд</text><text x="870" y="383" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Повтор: через 15 минут, пока сбой продолжается</text><text x="870" y="420" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Тихие часы: выключены</text><text x="870" y="457" font-family="Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#95A2B4">Критические события: отправлять всегда</text><rect x="264" y="531" width="1144" height="235" rx="8" fill="#12161D" stroke="#283240"/><text x="288" y="565" font-family="Inter,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#EFF3FA">Внешний наблюдатель</text><text x="288" y="609" font-family="Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#43C995">● Подключён · последний heartbeat 8 секунд назад</text><text x="288" y="648" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#95A2B4">Сервер отправляет heartbeat каждые 30 секунд. Нет сигнала 90 секунд — наблюдатель отправляет тревогу.</text><text x="288" y="675" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#95A2B4">Уведомления работают даже при потере домашнего интернета или отключении самого сервера.</text><rect x="288" y="700" width="223" height="40" rx="6" fill="#1B2431"/><text x="304" y="725" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="600" fill="#EFF3FA">Проверить наблюдатель</text><rect x="527" y="700" width="190" height="40" rx="6" fill="#1B2431"/><text x="543" y="725" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="600" fill="#EFF3FA">Журнал доставки</text><rect x="264" y="790" width="1144" height="130" rx="8" fill="#12161D" stroke="#283240"/><text x="288" y="824" font-family="Inter,DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#EFF3FA">Если внешнего наблюдателя нет</text><text x="288" y="860" font-family="Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#E6B660">При полном обрыве WAN сообщения ждут восстановления. Для немедленной доставки нужен резервный канал.</text></svg>