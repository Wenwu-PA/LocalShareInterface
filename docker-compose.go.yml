services:
  lanbridge-go:
    build:
      context: .
      dockerfile: Dockerfile.golang
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - go-data:/data
      - go-files:/files
    restart: "on-failure:3"
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
volumes:
  go-data:
  go-files:
